name: Independent Fork Native CLI Matrix

# Manual test on all three hosted operating systems. This job does not sign,
# notarize, publish, deploy or assert that the desktop UI has been tested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          # The reproducible source manifest checks the extracted folder name.
          path: craft-anything-full-upgraded
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source before running builds
        working-directory: craft-anything-full-upgraded
        run: python scripts/source_bundle_integrity.py verify-tree --root .
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev pkg-config libssl-dev
      - name: Install Rust 1.97 toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Regression-test target reopens and fail-closed ID collision checks
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-engine target_reopen_
      - name: Regression-test Deep configuration and Ghidra cache invalidation
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-engine deep_settings_
      - name: Regression-test Deep shutdown and analyzer version changes
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-engine deep_lifecycle_
      - name: Regression-test module inventory detects a restored-timestamp edit
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-engine inventory_tests
      - name: Type-check desktop settings propagation for Clean room
        working-directory: craft-anything-full-upgraded
        run: cargo check --locked -p craft-anything-ui-egui
      - name: Regression-test local agent target metadata handoff
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-ai mcp_target_handoff_
      - name: Regression-test safe annotation loading and atomic target restore
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-engine annotation_load_
      - name: Regression-test engine target-specific annotation persistence
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-engine target_close_
      - name: Regression-test CLI target ownership and cleanup
        working-directory: craft-anything-full-upgraded
        run: cargo test --locked -p craft-anything-cli --bin craft-anything-cli target_lifecycle_tests
      - name: Build CLI, parse WebAssembly and verify MCP target lifecycle
        working-directory: craft-anything-full-upgraded
        run: >-
          python scripts/native_cli_matrix.py
          --root .
          --timeout 2400
          --report "${{ runner.temp }}/craft_cli_smoke.json"
          --artifact-dir "${{ runner.temp }}/craft_cli_unsigned"
      - name: Retain native CLI evidence on failures too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-receipt-${{ matrix.os }}
          path: ${{ runner.temp }}/craft_cli_smoke.json
          if-no-files-found: warn
      - name: Retain unsigned, smoke-tested executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-native-cli-${{ matrix.os }}
          path: ${{ runner.temp }}/craft_cli_unsigned/
          if-no-files-found: error
          retention-days: 14
