name: Independent Fork Source Portability

# Manual cross-platform tests for the Python-only ZIP inventory and installer.
# These do not compile or launch the Rust desktop application.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: craft-anything-full-upgraded
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source inventory
        working-directory: craft-anything-full-upgraded
        run: python scripts/source_bundle_integrity.py verify-tree --root .
      - name: Test portable ZIP validation and extraction
        working-directory: craft-anything-full-upgraded
        run: python -m unittest discover -s scripts/tests -p test_source_bundle_integrity.py -v
