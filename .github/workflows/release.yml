name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-preflight:
    # Verify and attest the source at the commit being released before any
    # platform package is built or published. The published-asset check stays
    # the backstop.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/fork-release-source-preflight.yml
  release:
    needs: source-preflight
    # Pinned to the commit this repository releases with, not @main: this workflow receives the
    # Apple, Windows and Azure signing secrets, so an unreviewed push to craft-common-actions must
    # not reach them. Bump it deliberately (docs/releasing.md), reviewing the commits you cross.
    # The secretless workflows (gate, packaging-lint, sonarcloud, freebsd, windows-arm64) still
    # track @main so org-wide improvements arrive without churn.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@59d1ecc4ea15ab59f8d60d38b147d5016c1f1385 # 2026-11-16 "Fix shared cache save policy and target paths (#253)"
    with:
      app-name: craft-anything
      app-title: "Craft Anything"
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      version: ${{ inputs.version }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
  source-verify:
    # The release job creates a draft. Check the source ZIP actually attached
    # to that draft against the preflight receipt before a person publishes it.
    needs: [source-preflight, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source-preflight
          path: ${{ runner.temp }}/preflight
      - name: Find this run's draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASES: ${{ runner.temp }}/releases.json
          DRAFT: ${{ runner.temp }}/draft.json
        run: |
          # A draft records its tag before the Git tag exists and several drafts can be open, so
          # name the tag this release should carry and require exactly one draft with it.
          tag=$(python3 scripts/release_draft.py tag --root . --version "$INPUT_VERSION")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES"
          python3 scripts/release_draft.py select \
            --releases "$RELEASES" --tag "$tag" --commit "$SOURCE_COMMIT" > "$DRAFT"
          id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$DRAFT")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Draft release $id carries $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Download the draft's source asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          DESTINATION: ${{ runner.temp }}/draft
        run: |
          mkdir "$DESTINATION"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" > "$DESTINATION/assets.json"
          asset=$(python -c 'import fnmatch, json, sys; assets = json.load(open(sys.argv[1])); matches = [a for a in assets if fnmatch.fnmatchcase(a["name"].lower(), "*source*.zip")]; print(matches[0]["id"] if len(matches) == 1 else "")' "$DESTINATION/assets.json")
          if [ -z "$asset" ]; then
            echo "::error::The draft must attach exactly one source ZIP matching *source*.zip"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$DESTINATION/draft-source.zip"
      - name: Verify the draft's source asset against the preflight receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/preflight/release-source-preflight.json
          ARCHIVE: ${{ runner.temp }}/draft/draft-source.zip
        run: |
          python scripts/verify_release_source.py \
            --archive "$ARCHIVE" \
            --provenance "$RECEIPT" \
            --verify-attestation "$GITHUB_REPOSITORY" \
            --report "$RUNNER_TEMP/draft-source-receipt.json"
      - name: Upload the draft verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-source-receipt
          path: ${{ runner.temp }}/draft-source-receipt.json
          if-no-files-found: warn
