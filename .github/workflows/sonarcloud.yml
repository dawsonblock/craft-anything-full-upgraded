name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Pinned, not @main: `secrets: inherit` hands the shared workflow every repository secret,
    # the signing ones included, so an unreviewed push to craft-common-actions must not reach it.
    # Bump it with the release pin (docs/releasing.md). ecb64b2 is the commit the last green runs used.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0 # 2026-11-19
    secrets: inherit
